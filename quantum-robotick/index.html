<!DOCTYPE html><html lang="id" data-theme="dark"><head><meta charset="utf-8"><title>QUANTUM ROBOTICK</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#060A1E;--card:rgba(20,28,64,.72);--bd:rgba(86,200,255,.18);--tx:#e8efff;--mu:#8a98c4;--cy:#56C8FF;--pu:#9C6BFF;--go:#F3C64F;--up:#3BE3A2;--dn:#FF5F7E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{--bg:#dfe6f2;--card:rgba(247,249,253,.9);--bd:rgba(60,90,150,.2);--tx:#1d2740;--mu:#5c6a8a;--up:#0f9d6c;--dn:#d63a5c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px Manrope,sans-serif;min-height:100vh}
h1,h2,h3,.n{font-family:'Chakra Petch',sans-serif}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
.ban{position:relative;padding:18px 20px;background:linear-gradient(90deg,#060A1E,rgba(40,30,110,.7) 50%,#060A1E),radial-gradient(circle at 50% 0,#1b3a8a,#060A1E);color:#fff;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:14px}.brand img{height:84px;border-radius:12px;mix-blend-mode:screen}
.brand h1{margin:0;font-size:26px;letter-spacing:2px}.brand p{margin:2px 0 0;color:#b8c6ee}
nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:relative}
button,select,input{font:inherit;color:inherit}
.btn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer}.btn:hover{border-color:var(--cy)}
.pri{background:var(--cy);color:#04122b;border-color:var(--cy);font-weight:600}
#accList{position:absolute;top:44px;left:0;z-index:20;min-width:260px;background:#0d1535;border:1px solid var(--bd);border-radius:12px;padding:6px;display:none}
#accList div{padding:8px 10px;border-radius:8px;cursor:pointer;color:#e8efff}#accList div:hover{background:rgba(86,200,255,.15)}#accList small{display:block;color:#8a98c4}
main{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;padding:14px;max-width:1500px;margin:auto}
@media(max-width:1100px){main{grid-template-columns:1fr 1fr}.mid{order:-1;grid-column:1/-1}}@media(max-width:700px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;box-shadow:0 0 18px rgba(86,200,255,.08);margin-bottom:14px}
.card h3{margin:0 0 8px;font-size:15px;color:var(--cy)}
select,input{background:rgba(128,140,180,.12);border:1px solid var(--bd);border-radius:8px;padding:6px 8px}
.mu{color:var(--mu)}.up{color:var(--up)}.dn{color:var(--dn)}.n{font-weight:700}
.bar{display:flex;height:8px;border-radius:5px;overflow:hidden;margin:6px 0}.bar i{display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.side{border:1px solid var(--bd);border-radius:14px;padding:10px;text-align:center}
.ring{--p:50;--c:var(--cy);width:78px;height:78px;border-radius:50%;margin:4px auto;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(128,140,180,.2) 0);position:relative}
.ring:after{content:'';position:absolute;inset:7px;border-radius:50%;background:var(--bg)}.ring b{position:relative;z-index:1;font-family:'Chakra Petch';font-size:18px}
.kv{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.orbw{position:relative;width:250px;height:250px;margin:6px auto;display:grid;place-items:center}
.orb{--p:60;position:absolute;inset:14px;border-radius:50%;background:conic-gradient(var(--up) calc(var(--p)*1%),rgba(128,140,180,.2) 0)}
.orb:after{content:'';position:absolute;inset:10px;border-radius:50%;background:var(--bg)}
.dec{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--pu);opacity:.5;animation:sp 40s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.orbt{position:relative;z-index:1;text-align:center}.orbt .n{font-size:34px}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--up);animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.2}}
.flU{animation:fu .8s}.flD{animation:fd .8s}@keyframes fu{from{background:rgba(59,227,162,.4)}}@keyframes fd{from{background:rgba(255,95,126,.4)}}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.tri .n{font-size:18px;display:block}
.seg{display:flex;gap:4px;justify-content:center}.seg button{background:none;border:1px solid var(--bd);border-radius:20px;padding:5px 12px;cursor:pointer}.seg .on{background:var(--cy);color:#04122b}
.g8{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g8 div{border:1px solid var(--bd);border-radius:12px;padding:8px}.g8 .n{font-size:17px;display:block}
.meter{height:7px;background:rgba(128,140,180,.2);border-radius:4px;overflow:hidden}.meter i{display:block;height:100%;background:var(--cy)}
dialog{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:18px;width:min(960px,96vw);max-height:92vh;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr) 1.1fr;gap:4px}.cal .h{text-align:center;color:var(--mu);font-size:11px}
.day{min-height:62px;border-radius:8px;padding:4px;font-size:11px;position:relative;cursor:pointer;background:rgba(128,140,180,.07)}
.day.p{background:rgba(59,227,162,.16);border-top:2px solid var(--up)}.day.l{background:rgba(255,95,126,.16);border-top:2px solid var(--dn)}
.day .d{position:absolute;right:5px;top:3px;color:var(--mu)}.wk{background:rgba(156,107,255,.12);border-radius:8px;padding:4px;font-size:11px}
@media(max-width:700px){.day{min-height:48px;font-size:9px}}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:6px;text-align:right;border-bottom:1px solid var(--bd)}th:first-child,td:first-child{text-align:left}
.sc{overflow-x:auto;max-height:46vh;overflow-y:auto}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:6px 10px;cursor:pointer}.tabs .on{border-color:var(--cy);color:var(--cy)}
.row{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}.row label{min-width:150px}
</style></head><body>
